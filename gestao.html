<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão New Mídia</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@keyframes tally{0%,100%{opacity:1}50%{opacity:.3}}
html,body{background:#0B0E14}
*{-webkit-tap-highlight-color:transparent}
body,.font-sans{font-family:'Archivo',system-ui,sans-serif !important}
.font-mono{font-family:'Space Mono',ui-monospace,monospace !important}
.disp{font-family:'Anton','Arial Narrow',sans-serif;font-weight:400;letter-spacing:.01em}
.eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo}=React;

const T={bg:"#0B0E14",panel:"#141821",panel2:"#1A2029",line:"#28303C",fg:"#ECEBE6",mut:"#8A94A3",mut2:"#59626F",tl:"#4FD1C5",coral:"#FF7A59",amber:"#F5A524",violet:"#A78BFA",blue:"#60A5FA"};
const PALETA=[T.tl,T.coral,T.violet,T.blue,T.amber,"#34D399"];
const DURACOES=[5,10,15];
const KEY="newmidia-gestao-v1";
const HOY=new Date().toISOString().slice(0,10);
const offset=(d)=>{const x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10);};
const brl=(n)=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const tc=(s)=>{s=Math.max(0,Math.round(s));const m=Math.floor(s/60),r=s%60;return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");};
const dataBR=(d)=>(d?d.split("-").reverse().join("/"):"—");
const diasAte=(d)=>Math.ceil((new Date(d)-new Date(HOY))/86400000);
const vigente=(a)=>(!a.inicio||a.inicio<=HOY)&&(!a.fim||a.fim>=HOY);
function statusDe(a){
  if(a.fim&&a.fim<HOY)return{k:"expirado",label:"Expirado",cor:T.coral};
  if(a.inicio&&a.inicio>HOY)return{k:"agendado",label:"Agendado",cor:T.violet};
  if(!a.ativo)return{k:"pausado",label:"Pausado",cor:T.mut};
  return{k:"no_ar",label:"No ar",cor:T.tl};
}
const PAGTO={pago:{label:"Pago",cor:T.tl},pendente:{label:"Pendente",cor:T.amber},atrasado:{label:"Atrasado",cor:T.coral}};

// ---- ícones (SVG inline) ----
function Ic({size=24,fill="none",stroke="currentColor",style,className,children}){
  return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={stroke} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style} className={className}>{children}</svg>;
}
const LayoutDashboard=p=><Ic {...p}><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></Ic>;
const Ticket=p=><Ic {...p}><path d="M4 5h16a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7a2 2 0 0 1 2-2Z"/><line x1="12" y1="7" x2="12" y2="17" strokeDasharray="2 3"/></Ic>;
const ListOrdered=p=><Ic {...p}><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><line x1="4" y1="6" x2="4.4" y2="6"/><line x1="4" y1="12" x2="4.4" y2="12"/><line x1="4" y1="18" x2="4.4" y2="18"/></Ic>;
const MonitorPlay=p=><Ic {...p}><rect x="2" y="3" width="20" height="14" rx="2"/><polygon points="10 7 15 10 10 13" fill="currentColor" stroke="none"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></Ic>;
const Plus=p=><Ic {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Ic>;
const Pencil=p=><Ic {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></Ic>;
const Trash2=p=><Ic {...p}><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Ic>;
const ArrowUp=p=><Ic {...p}><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></Ic>;
const ArrowDown=p=><Ic {...p}><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></Ic>;
const Play=p=><Ic {...p}><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></Ic>;
const Pause=p=><Ic {...p}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></Ic>;
const X=p=><Ic {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Ic>;
const Clock=p=><Ic {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Ic>;
const DollarSign=p=><Ic {...p}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></Ic>;
const Radio=p=><Ic {...p}><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4"/></Ic>;
const UploadCloud=p=><Ic {...p}><path d="M16 16l-4-4-4 4"/><path d="M12 12v9"/><path d="M20.4 14.5A5 5 0 0 0 18 6h-1.3A8 8 0 1 0 4 15.3"/></Ic>;
const CheckCircle2=p=><Ic {...p}><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></Ic>;
const AlertTriangle=p=><Ic {...p}><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Ic>;
const CalendarClock=p=><Ic {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></Ic>;
const Lock=p=><Ic {...p}><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Ic>;

const SEED=[
  {id:1,cliente:"Ótica Visão Clara",segmento:"Ótica",titulo:"2 óculos pelo preço de 1",duracao:10,valor:675,inicio:offset(-40),fim:offset(140),cor:T.tl,ativo:true,exclusivo:true,publicado:true,cobranca:"mensal",pagamento:"pago",forma:"Pix",diaVenc:"10",telefone:"(18) 99999-0001"},
  {id:2,cliente:"Auto Peças Veloz",segmento:"Automóveis",titulo:"Revisão completa com desconto",duracao:15,valor:945,inicio:offset(-60),fim:offset(200),cor:T.blue,ativo:true,exclusivo:false,publicado:true,cobranca:"avista",pagamento:"pago",forma:"Transferência",diaVenc:"",telefone:"(18) 99999-0002"},
  {id:3,cliente:"Pizzaria Bella Massa",segmento:"Alimentação",titulo:"Terça da Pizza em dobro",duracao:5,valor:540,inicio:offset(-10),fim:offset(20),cor:T.amber,ativo:true,exclusivo:false,publicado:false,cobranca:"mensal",pagamento:"atrasado",forma:"Pix",diaVenc:"5",telefone:"(18) 99999-0003"},
  {id:4,cliente:"Academia Corpo em Forma",segmento:"Fitness",titulo:"Matrícula grátis neste mês",duracao:10,valor:675,inicio:offset(8),fim:offset(98),cor:T.violet,ativo:true,exclusivo:false,publicado:false,cobranca:"mensal",pagamento:"pendente",forma:"Boleto",diaVenc:"15",telefone:"(18) 99999-0004"},
];
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return null;}

function App(){
  const saved=useMemo(load,[]);
  const [ads,setAds]=useState(saved&&saved.ads?saved.ads:SEED);
  const [cotasTotal,setCotasTotal]=useState(saved&&saved.cotasTotal?saved.cotasTotal:10);
  const [tab,setTab]=useState("painel");
  const [editing,setEditing]=useState(null);
  const persist=(a,t)=>{try{localStorage.setItem(KEY,JSON.stringify({ads:a,cotasTotal:t}));}catch(e){}};
  const commit=(a,t=cotasTotal)=>{setAds(a);setCotasTotal(t);persist(a,t);};

  const salvar=(ad)=>{let next;if(ad.id)next=ads.map(a=>a.id===ad.id?ad:a);else next=[...ads,{...ad,id:Date.now(),publicado:false}];commit(next);setEditing(null);};
  const remover=(id)=>commit(ads.filter(a=>a.id!==id));
  const toggleAtivo=(id)=>commit(ads.map(a=>a.id===id?{...a,ativo:!a.ativo}:a));
  const togglePub=(id)=>commit(ads.map(a=>a.id===id?{...a,publicado:!a.publicado}:a));
  const cyclePagto=(id)=>commit(ads.map(a=>a.id===id?{...a,pagamento:a.pagamento==="pendente"?"pago":a.pagamento==="pago"?"atrasado":"pendente"}:a));
  const mover=(i,dir)=>{const j=i+dir;if(j<0||j>=ads.length)return;const n=[...ads];const t=n[i];n[i]=n[j];n[j]=t;commit(n);};

  const loop=ads.filter(a=>statusDe(a).k==="no_ar");
  const loopTotal=loop.reduce((s,a)=>s+Number(a.duracao||0),0);
  const receita=ads.filter(vigente).reduce((s,a)=>s+Number(a.valor||0),0);
  const insHora=loopTotal>0?Math.floor(3600/loopTotal):0;
  const ocupadas=ads.filter(vigente).length;
  const disponiveis=Math.max(0,cotasTotal-ocupadas);
  const pendentes=ads.filter(a=>statusDe(a).k==="no_ar"&&!a.publicado);
  const vencendo=ads.filter(a=>vigente(a)&&a.fim&&diasAte(a.fim)<=30).sort((a,b)=>a.fim.localeCompare(b.fim));
  const aReceber=ads.filter(a=>vigente(a)&&(a.pagamento==="pendente"||a.pagamento==="atrasado"));
  const conflitos=(()=>{const seg={};ads.filter(vigente).forEach(a=>{(seg[a.segmento]=seg[a.segmento]||[]).push(a);});return Object.entries(seg).filter(([,arr])=>arr.length>1&&arr.some(a=>a.exclusivo)).map(([s])=>s);})();

  const NAV=[{id:"painel",label:"Painel",icon:LayoutDashboard},{id:"cotas",label:"Cotas",icon:Ticket},{id:"grade",label:"Grade",icon:ListOrdered},{id:"noar",label:"No ar",icon:MonitorPlay}];

  return (
    <div className="min-h-screen w-full font-sans" style={{background:T.bg,color:T.fg}}>
      <header className="px-5 pt-6 pb-4 border-b" style={{borderColor:T.line}}>
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-2"><Radio size={18} style={{color:T.tl}}/><span className="text-xs font-mono tracking-widest" style={{color:T.mut}}>NEW·MÍDIA · GESTÃO</span></div>
          <div className="text-xs font-mono px-2.5 py-1 rounded-full" style={{background:T.panel,color:disponiveis>0?T.tl:T.coral,border:"1px solid "+T.line}}>{ocupadas}/{cotasTotal} cotas</div>
        </div>
        <h1 className="disp mt-1" style={{fontSize:"26px",lineHeight:1,textTransform:"uppercase"}}>Painel de LED · Presidente Prudente</h1>
      </header>
      <main className="px-5 pt-5" style={{paddingBottom:92}}>
        {tab==="painel"&&<Painel {...{receita,ocupadas,cotasTotal,disponiveis,loop,loopTotal,insHora,pendentes,vencendo,aReceber,conflitos,setTab,setCotasTotal:(n)=>commit(ads,n)}}/>}
        {tab==="cotas"&&<Cotas {...{ads,setEditing,remover,toggleAtivo,togglePub,cyclePagto}}/>}
        {tab==="grade"&&<Grade {...{ads,loop,loopTotal,insHora,mover}}/>}
        {tab==="noar"&&<NoAr {...{loop,loopTotal}}/>}
      </main>
      <nav className="fixed bottom-0 left-0 right-0 border-t flex" style={{background:T.panel,borderColor:T.line}}>
        {NAV.map(n=>{const on=tab===n.id;const badge=n.id==="cotas"&&pendentes.length>0;const Icn=n.icon;return (
          <button key={n.id} onClick={()=>setTab(n.id)} className="relative flex-1 flex flex-col items-center gap-1 py-3" style={{color:on?T.tl:T.mut}}>
            <Icn size={20}/>{badge&&<span className="absolute top-2" style={{right:"calc(50% - 18px)",width:8,height:8,borderRadius:"50%",background:T.coral}}/>}<span className="text-[11px]">{n.label}</span>
          </button>);})}
      </nav>
      {editing&&<Editor inicial={editing} onSalvar={salvar} onFechar={()=>setEditing(null)}/>}
    </div>
  );
}

function Painel({receita,ocupadas,cotasTotal,disponiveis,loop,loopTotal,insHora,pendentes,vencendo,aReceber,conflitos,setTab,setCotasTotal}){
  const Card=({icon:Icn,cor,valor,label})=>(<div className="rounded-2xl p-4 border" style={{background:T.panel,borderColor:T.line}}><Icn size={18} style={{color:cor}}/><div className="text-2xl font-semibold mt-2 font-mono">{valor}</div><div className="text-xs mt-0.5" style={{color:T.mut}}>{label}</div></div>);
  return (
    <div className="flex flex-col gap-4">
      {pendentes.length>0&&(
        <div className="rounded-2xl p-4 border" style={{background:"rgba(255,122,89,.08)",borderColor:"rgba(255,122,89,.4)"}}>
          <div className="flex items-center gap-2"><UploadCloud size={18} style={{color:T.coral}}/><h2 className="text-sm font-semibold" style={{color:T.coral}}>{pendentes.length} anúncio(s) a publicar no ViPlex</h2></div>
          <p className="text-xs mt-1 mb-2" style={{color:T.mut}}>Suba o vídeo no ViPlex Handy, publique no painel e marque como publicado na aba Cotas.</p>
          <div className="flex flex-col gap-1">{pendentes.map(a=>(<div key={a.id} className="flex items-center gap-2 text-sm"><span className="w-1.5 h-1.5 rounded-full" style={{background:a.cor}}/><span className="truncate">{a.cliente}</span><span className="font-mono text-xs ml-auto" style={{color:T.mut}}>{a.duracao}s</span></div>))}</div>
          <button onClick={()=>setTab("cotas")} className="mt-3 text-xs font-medium rounded-lg px-3 py-2 w-full" style={{background:T.coral,color:"#2a0f06"}}>Ir para Cotas</button>
        </div>)}
      <div className="rounded-2xl border p-4" style={{background:T.panel,borderColor:T.line}}>
        <div className="eyebrow" style={{color:T.mut}}>Receita mensal vigente</div>
        <div className="disp" style={{fontSize:"44px",lineHeight:.9,marginTop:"6px"}}>{brl(receita)}</div>
      </div>
      <div className="flex rounded-2xl border overflow-hidden" style={{borderColor:T.line,background:T.panel}}>
        <div className="flex-1 p-4"><div className="disp" style={{fontSize:"26px",lineHeight:.9,color:disponiveis>0?T.tl:T.coral}}>{ocupadas+"/"+cotasTotal}</div><div className="eyebrow mt-2" style={{color:T.mut,fontSize:"9px",letterSpacing:".1em"}}>Cotas</div></div>
        <div className="flex-1 p-4 border-l" style={{borderColor:T.line}}><div className="disp" style={{fontSize:"26px",lineHeight:.9}}>{loop.length}</div><div className="eyebrow mt-2" style={{color:T.mut,fontSize:"9px",letterSpacing:".1em"}}>No ar</div></div>
        <div className="flex-1 p-4 border-l" style={{borderColor:T.line}}><div className="disp" style={{fontSize:"26px",lineHeight:.9,color:T.blue}}>{tc(loopTotal)}</div><div className="eyebrow mt-2" style={{color:T.mut,fontSize:"9px",letterSpacing:".1em"}}>Loop</div></div>
      </div>
      <div className="rounded-2xl p-4 border flex items-center justify-between" style={{background:T.panel,borderColor:T.line}}>
        <div><div className="text-sm font-medium">Total de cotas do painel</div><div className="text-xs" style={{color:T.mut}}>Menos cotas = mais aparições por marca</div></div>
        <div className="flex items-center gap-3">
          <button onClick={()=>setCotasTotal(Math.max(ocupadas,cotasTotal-1))} className="w-8 h-8 rounded-lg text-lg" style={{background:T.panel2}}>–</button>
          <span className="font-mono text-lg w-6 text-center">{cotasTotal}</span>
          <button onClick={()=>setCotasTotal(cotasTotal+1)} className="w-8 h-8 rounded-lg text-lg" style={{background:T.panel2}}>+</button>
        </div>
      </div>
      {conflitos.length>0&&(
        <div className="rounded-2xl p-4 border" style={{background:T.panel,borderColor:"rgba(245,165,36,.4)"}}>
          <div className="flex items-center gap-2 mb-1"><AlertTriangle size={16} style={{color:T.amber}}/><h2 className="text-sm font-semibold">Exclusividade em conflito</h2></div>
          <p className="text-xs" style={{color:T.mut}}>Você prometeu exclusividade e há mais de uma marca ativa em: <b style={{color:T.fg}}>{conflitos.join(", ")}</b>. Revise antes que o cliente perceba.</p>
        </div>)}
      <div className="rounded-2xl p-4 border" style={{background:T.panel,borderColor:T.line}}>
        <div className="flex items-center gap-2 mb-3"><CalendarClock size={16} style={{color:T.coral}}/><h2 className="text-sm font-semibold">Vencendo em 30 dias</h2></div>
        {vencendo.length===0?<p className="text-sm" style={{color:T.mut}}>Nenhum contrato perto de vencer.</p>:(
          <div className="flex flex-col gap-2">{vencendo.map(a=>(<div key={a.id} className="flex items-center justify-between"><div className="flex items-center gap-2 min-w-0"><span className="w-2 h-2 rounded-full shrink-0" style={{background:a.cor}}/><span className="text-sm truncate">{a.cliente}</span></div><span className="text-xs font-mono shrink-0 ml-2" style={{color:diasAte(a.fim)<=7?T.coral:T.mut}}>{diasAte(a.fim)}d · {dataBR(a.fim)}</span></div>))}</div>)}
      </div>
      <div className="rounded-2xl p-4 border" style={{background:T.panel,borderColor:T.line}}>
        <div className="flex items-center gap-2 mb-3"><DollarSign size={16} style={{color:T.coral}}/><h2 className="text-sm font-semibold">Pagamentos a receber</h2></div>
        {aReceber.length===0?<p className="text-sm" style={{color:T.mut}}>Tudo em dia.</p>:(
          <div className="flex flex-col gap-2">{aReceber.map(a=>(<div key={a.id} className="flex items-center justify-between"><div className="flex items-center gap-2 min-w-0"><span className="w-2 h-2 rounded-full shrink-0" style={{background:PAGTO[a.pagamento].cor}}/><span className="text-sm truncate">{a.cliente}</span></div><span className="text-xs font-mono shrink-0 ml-2" style={{color:PAGTO[a.pagamento].cor}}>{PAGTO[a.pagamento].label} · {brl(a.valor)}</span></div>))}</div>)}
      </div>
      <button onClick={()=>setTab("noar")} className="rounded-2xl py-3.5 font-medium flex items-center justify-center gap-2" style={{background:T.tl,color:"#04211E"}}><Play size={18}/> Ver o painel no ar</button>
    </div>
  );
}

function Cotas({ads,setEditing,remover,toggleAtivo,togglePub,cyclePagto}){
  return (
    <div className="flex flex-col gap-3">
      <div className="flex items-center justify-between"><h2 className="text-sm font-semibold" style={{color:T.mut}}>{ads.length} cota(s)</h2>
        <button onClick={()=>setEditing({})} className="flex items-center gap-1.5 text-sm font-medium rounded-full px-3 py-1.5" style={{background:T.tl,color:"#04211E"}}><Plus size={16}/> Nova cota</button></div>
      {ads.length===0&&<p className="text-sm py-8 text-center" style={{color:T.mut}}>Nenhuma cota ainda. Toque em “Nova cota” para começar.</p>}
      {ads.map(a=>{const s=statusDe(a);const pendente=s.k==="no_ar"&&!a.publicado;return (
        <div key={a.id} className="rounded-2xl p-4 border" style={{background:T.panel,borderColor:pendente?"rgba(255,122,89,.4)":T.line}}>
          <div className="flex items-start gap-3"><span className="w-1.5 self-stretch rounded-full shrink-0" style={{background:a.cor}}/>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-mono px-1.5 py-0.5 rounded" style={{background:T.panel2,color:s.cor}}>{s.label}</span>
                <span className="text-xs font-mono" style={{color:T.mut}}>{a.duracao}s</span>
                {a.exclusivo&&<span className="text-xs font-mono px-1.5 py-0.5 rounded flex items-center gap-1" style={{background:T.panel2,color:T.violet}}><Lock size={10}/> exclusivo</span>}
                {pendente?<span className="text-xs font-mono px-1.5 py-0.5 rounded" style={{background:"rgba(255,122,89,.15)",color:T.coral}}>pendente no painel</span>:(s.k==="no_ar"&&<span className="text-xs font-mono px-1.5 py-0.5 rounded flex items-center gap-1" style={{background:T.panel2,color:T.tl}}><CheckCircle2 size={10}/> publicado</span>)}
              </div>
              <h3 className="font-medium mt-1 truncate">{a.titulo}</h3>
              <p className="text-sm truncate" style={{color:T.mut}}>{a.cliente} · {a.segmento}</p>
              <p className="text-xs mt-1 font-mono" style={{color:T.mut}}>{dataBR(a.inicio)} → {dataBR(a.fim)}</p>
              <p className="text-xs mt-0.5 font-mono" style={{color:T.mut}}>{brl(a.valor)} · {a.cobranca==="avista"?"à vista":"mensal"+(a.diaVenc?" (venc. dia "+a.diaVenc+")":"")} · {a.forma}</p>
            </div></div>
          {pendente&&<div className="mt-3 rounded-lg px-3 py-2 text-xs flex items-center gap-2" style={{background:"rgba(255,122,89,.08)",color:T.coral}}><UploadCloud size={14}/> Publique o vídeo ({a.duracao}s) no ViPlex Handy e marque como publicado.</div>}
          <div className="flex items-center gap-2 mt-3 pt-3 border-t flex-wrap" style={{borderColor:T.line}}>
            <button onClick={()=>cyclePagto(a.id)} className="text-xs px-3 py-1.5 rounded-lg" style={{background:T.panel2,color:PAGTO[a.pagamento].cor}}>Pagto: {PAGTO[a.pagamento].label}</button>
            <button onClick={()=>togglePub(a.id)} className="text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5" style={{background:a.publicado?T.panel2:T.coral,color:a.publicado?T.mut:"#2a0f06"}}>{a.publicado?"Marcar não publicado":<span className="flex items-center gap-1.5"><CheckCircle2 size={13}/> Publiquei no ViPlex</span>}</button>
            <button onClick={()=>toggleAtivo(a.id)} className="text-xs px-3 py-1.5 rounded-lg" style={{background:T.panel2,color:a.ativo?T.tl:T.mut}}>{a.ativo?"Pausar":"Ativar"}</button>
            <button onClick={()=>setEditing(a)} className="text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5" style={{background:T.panel2,color:T.fg}}><Pencil size={13}/> Editar</button>
            <button onClick={()=>remover(a.id)} className="text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5 ml-auto" style={{background:T.panel2,color:T.coral}}><Trash2 size={13}/></button>
          </div>
        </div>);})}
    </div>
  );
}

function Grade({ads,loop,loopTotal,insHora,mover}){
  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4 border flex items-center justify-between" style={{background:T.panel,borderColor:T.line}}>
        <div><div className="text-xs" style={{color:T.mut}}>Loop completo</div><div className="text-xl font-semibold font-mono mt-0.5">{tc(loopTotal)}</div></div>
        <div className="text-right"><div className="text-xs" style={{color:T.mut}}>Cada marca toca</div><div className="text-xl font-semibold font-mono mt-0.5">{insHora}×/h</div></div>
      </div>
      {loop.length>0&&<div className="flex h-3 rounded-full overflow-hidden" style={{background:T.panel2}}>{loop.map(a=><div key={a.id} style={{background:a.cor,width:((a.duracao/loopTotal)*100)+"%"}} title={a.cliente}/>)}</div>}
      <div className="flex flex-col gap-2"><h2 className="text-sm font-semibold" style={{color:T.mut}}>Ordem no painel</h2>
        {ads.length===0&&<p className="text-sm" style={{color:T.mut}}>Cadastre cotas na aba Cotas.</p>}
        {ads.map((a,i)=>{const s=statusDe(a);const noAr=s.k==="no_ar";return (
          <div key={a.id} className="rounded-xl p-3 border flex items-center gap-3" style={{background:T.panel,borderColor:T.line,opacity:noAr?1:.5}}>
            <span className="text-xs font-mono w-5 text-center" style={{color:T.mut}}>{i+1}</span>
            <span className="w-2 h-2 rounded-full shrink-0" style={{background:a.cor}}/>
            <div className="flex-1 min-w-0"><div className="text-sm truncate">{a.titulo}</div><div className="text-xs font-mono" style={{color:s.cor}}>{s.label} · {a.duracao}s {noAr&&!a.publicado&&<span style={{color:T.coral}}>· pendente</span>}</div></div>
            <div className="flex flex-col gap-1">
              <button onClick={()=>mover(i,-1)} disabled={i===0} className="p-1 rounded" style={{background:T.panel2,opacity:i===0?.3:1}}><ArrowUp size={14}/></button>
              <button onClick={()=>mover(i,1)} disabled={i===ads.length-1} className="p-1 rounded" style={{background:T.panel2,opacity:i===ads.length-1?.3:1}}><ArrowDown size={14}/></button>
            </div>
          </div>);})}
      </div>
    </div>
  );
}

function NoAr({loop,loopTotal}){
  const [playing,setPlaying]=useState(false);
  const [idx,setIdx]=useState(0);
  const [el,setEl]=useState(0);
  const ref=useRef();
  useEffect(()=>{if(idx>=loop.length){setIdx(0);setEl(0);}},[loop.length]);
  useEffect(()=>{
    if(!playing||loop.length===0)return;
    ref.current=setInterval(()=>{setEl(e=>{const dur=Number(loop[idx]?.duracao||1);if(e+1>=dur){setIdx(i=>(i+1)%loop.length);return 0;}return e+1;});},1000);
    return ()=>clearInterval(ref.current);
  },[playing,idx,loop]);
  if(loop.length===0)return <div className="rounded-2xl p-8 border text-center" style={{background:T.panel,borderColor:T.line}}><MonitorPlay size={28} style={{color:T.mut}} className="mx-auto"/><p className="text-sm mt-3" style={{color:T.mut}}>Nada no ar. Ative cotas para montar o loop.</p></div>;
  const atual=loop[idx]||loop[0];const dur=Number(atual.duracao||1);const prox=loop[(idx+1)%loop.length];
  const decorrido=loop.slice(0,idx).reduce((s,a)=>s+Number(a.duracao),0)+el;
  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl overflow-hidden border mx-auto w-full" style={{borderColor:T.line,maxWidth:300}}>
        <div className="relative flex items-center justify-center p-8" style={{background:atual.cor,aspectRatio:"9/16"}}>
          <div className="absolute top-3 left-3 flex items-center gap-1.5"><span style={{width:10,height:10,borderRadius:"50%",background:"#fff",display:"inline-block",animation:playing?"tally 1.2s infinite":"none",opacity:playing?1:.4}}/><span className="text-[11px] font-mono font-bold text-white tracking-wider">{playing?"NO AR":"PAUSADO"}</span></div>
          <span className="absolute top-3 right-3 text-[11px] font-mono text-white" style={{opacity:.85}}>{tc(decorrido)}/{tc(loopTotal)}</span>
          <div className="text-center"><div className="text-xs font-mono text-white mb-2" style={{opacity:.85}}>{atual.cliente}</div><div className="disp text-white leading-tight" style={{fontSize:"22px",textTransform:"uppercase",textShadow:"0 1px 12px rgba(0,0,0,.25)"}}>{atual.titulo}</div>{!atual.publicado&&<div className="mt-3 text-[11px] font-mono text-white inline-block px-2 py-1 rounded" style={{background:"rgba(0,0,0,.35)"}}>simulação · publicar no ViPlex</div>}</div>
        </div>
        <div className="h-1.5" style={{background:T.panel2}}><div className="h-full transition-all" style={{width:((el/dur)*100)+"%",background:T.tl}}/></div>
      </div>
      <div className="flex items-center gap-3">
        <button onClick={()=>setPlaying(p=>!p)} className="flex-1 rounded-2xl py-3.5 font-medium flex items-center justify-center gap-2" style={{background:playing?T.panel2:T.tl,color:playing?T.fg:"#04211E"}}>{playing?<span className="flex items-center gap-2"><Pause size={18}/> Pausar</span>:<span className="flex items-center gap-2"><Play size={18}/> Tocar loop</span>}</button>
        <div className="rounded-2xl px-4 py-3.5 border font-mono text-sm" style={{background:T.panel,borderColor:T.line,color:T.mut}}>{tc(dur-el)} restante</div>
      </div>
      <div className="rounded-2xl p-4 border" style={{background:T.panel,borderColor:T.line}}><div className="text-xs mb-2" style={{color:T.mut}}>A seguir</div><div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full" style={{background:prox.cor}}/><span className="text-sm truncate">{prox.titulo}</span><span className="text-xs font-mono ml-auto" style={{color:T.mut}}>{prox.duracao}s</span></div></div>
    </div>
  );
}

function Switch({on}){return <span className="w-10 h-6 rounded-full flex items-center px-0.5 transition-all" style={{background:on?T.tl:T.panel2}}><span className="w-5 h-5 rounded-full bg-white transition-all" style={{marginLeft:on?16:0}}/></span>;}

function Editor({inicial,onSalvar,onFechar}){
  const [f,setF]=useState({cliente:"",segmento:"",titulo:"",duracao:10,valor:"",inicio:HOY,fim:"",cor:PALETA[0],ativo:true,exclusivo:false,publicado:false,cobranca:"mensal",pagamento:"pendente",forma:"Pix",diaVenc:"",telefone:"",...inicial});
  const set=(k,v)=>setF(s=>({...s,[k]:v}));
  const valido=f.cliente.trim()&&f.titulo.trim();
  const inp={background:T.bg,borderColor:T.line,color:T.fg};
  const Campo=({label,children})=>(<label className="block"><span className="text-xs" style={{color:T.mut}}>{label}</span><div className="mt-1">{children}</div></label>);
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{background:"rgba(0,0,0,.6)"}} onClick={onFechar}>
      <div className="w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl border max-h-[92vh] overflow-y-auto" style={{background:T.panel,borderColor:T.line}} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 pt-5 pb-3 sticky top-0" style={{background:T.panel}}><h2 className="text-lg font-semibold">{inicial.id?"Editar cota":"Nova cota"}</h2><button onClick={onFechar} className="p-1.5 rounded-lg" style={{background:T.panel2}}><X size={18}/></button></div>
        <div className="px-5 pb-5 flex flex-col gap-3">
          <Campo label="Cliente"><input value={f.cliente} onChange={e=>set("cliente",e.target.value)} placeholder="Ex.: Padaria do Zé" className="w-full rounded-xl border px-3 py-2.5 text-sm outline-none" style={inp}/></Campo>
          <div className="grid grid-cols-2 gap-3">
            <Campo label="Segmento"><input value={f.segmento} onChange={e=>set("segmento",e.target.value)} placeholder="Ex.: Alimentação" className="w-full rounded-xl border px-3 py-2.5 text-sm outline-none" style={inp}/></Campo>
            <Campo label="Valor mensal (R$)"><input type="number" inputMode="numeric" value={f.valor} onChange={e=>set("valor",e.target.value)} className="w-full rounded-xl border px-3 py-2.5 text-sm outline-none font-mono" style={inp}/></Campo>
          </div>
          <Campo label="Título do anúncio"><input value={f.titulo} onChange={e=>set("titulo",e.target.value)} placeholder="Ex.: Café + pão na chapa por R$5" className="w-full rounded-xl border px-3 py-2.5 text-sm outline-none" style={inp}/></Campo>
          <Campo label="Duração do vídeo"><div className="flex gap-2">{DURACOES.map(d=>(<button key={d} onClick={()=>set("duracao",d)} className="flex-1 rounded-xl border py-2.5 text-sm font-mono" style={{borderColor:f.duracao===d?T.tl:T.line,background:f.duracao===d?"rgba(79,209,197,.12)":T.bg,color:f.duracao===d?T.tl:T.mut}}>{d}s</button>))}</div></Campo>
          <div className="grid grid-cols-2 gap-3">
            <Campo label="Início"><input type="date" value={f.inicio} onChange={e=>set("inicio",e.target.value)} className="w-full rounded-xl border px-3 py-2.5 text-sm outline-none font-mono" style={inp}/></Campo>
            <Campo label="Fim"><input type="date" value={f.fim} onChange={e=>set("fim",e.target.value)} className="w-full rounded-xl border px-3 py-2.5 text-sm outline-none font-mono" style={inp}/></Campo>
          </div>
          <Campo label="Cor na tela"><div className="flex gap-2 mt-1">{PALETA.map(c=><button key={c} onClick={()=>set("cor",c)} className="w-8 h-8 rounded-full" style={{background:c,outline:f.cor===c?"2px solid "+T.fg:"none",outlineOffset:2}}/>)}</div></Campo>
          <div className="grid grid-cols-2 gap-3">
            <Campo label="Forma de pagamento"><select value={f.forma} onChange={e=>set("forma",e.target.value)} className="w-full rounded-xl border px-3 py-2.5 text-sm outline-none" style={inp}>{["Pix","Dinheiro","Cartão","Boleto","Transferência"].map(o=><option key={o} value={o}>{o}</option>)}</select></Campo>
            <Campo label="Cobrança"><div className="flex gap-2">{[["mensal","Mensal"],["avista","À vista"]].map(([v,l])=>(<button key={v} onClick={()=>set("cobranca",v)} className="flex-1 rounded-xl border py-2.5 text-sm" style={{borderColor:f.cobranca===v?T.tl:T.line,background:f.cobranca===v?"rgba(79,209,197,.12)":T.bg,color:f.cobranca===v?T.tl:T.mut}}>{l}</button>))}</div></Campo>
          </div>
          <Campo label="Status do pagamento"><div className="flex gap-2">{[["pago","Pago"],["pendente","Pendente"],["atrasado","Atrasado"]].map(([v,l])=>(<button key={v} onClick={()=>set("pagamento",v)} className="flex-1 rounded-xl border py-2.5 text-sm" style={{borderColor:f.pagamento===v?PAGTO[v].cor:T.line,background:f.pagamento===v?"rgba(255,255,255,.05)":T.bg,color:f.pagamento===v?PAGTO[v].cor:T.mut}}>{l}</button>))}</div></Campo>
          <div className="grid grid-cols-2 gap-3">
            <Campo label="Dia do venc. (se mensal)"><input type="number" inputMode="numeric" value={f.diaVenc} onChange={e=>set("diaVenc",e.target.value)} placeholder="ex.: 10" className="w-full rounded-xl border px-3 py-2.5 text-sm outline-none font-mono" style={inp}/></Campo>
            <Campo label="Telefone (opcional)"><input value={f.telefone} onChange={e=>set("telefone",e.target.value)} placeholder="(18) 99999-0000" className="w-full rounded-xl border px-3 py-2.5 text-sm outline-none font-mono" style={inp}/></Campo>
          </div>
          <button onClick={()=>set("exclusivo",!f.exclusivo)} className="flex items-center justify-between rounded-xl border px-3 py-2.5" style={{borderColor:T.line}}><span className="text-sm flex items-center gap-2"><Lock size={14} style={{color:T.violet}}/> Exclusividade de segmento</span><Switch on={f.exclusivo}/></button>
          <button onClick={()=>set("ativo",!f.ativo)} className="flex items-center justify-between rounded-xl border px-3 py-2.5" style={{borderColor:T.line}}><span className="text-sm">Colocar no ar</span><Switch on={f.ativo}/></button>
          {inicial.id&&<button onClick={()=>set("publicado",!f.publicado)} className="flex items-center justify-between rounded-xl border px-3 py-2.5" style={{borderColor:T.line}}><span className="text-sm">Já publicado no ViPlex</span><Switch on={f.publicado}/></button>}
          <button onClick={()=>valido&&onSalvar({...f,valor:Number(f.valor)||0})} disabled={!valido} className="rounded-2xl py-3.5 font-medium mt-1" style={{background:valido?T.tl:T.panel2,color:valido?"#04211E":T.mut}}>{inicial.id?"Salvar alterações":"Cadastrar cota"}</button>
          {!inicial.id&&<p className="text-xs text-center" style={{color:T.mut}}>Novas cotas entram como “pendente no painel” até você publicar no ViPlex.</p>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
